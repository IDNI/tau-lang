name: LTL sweep

# Every temporal triple over o1, o2 and i1 against Spot, and every formula of
# two operators that reads the fixed steps o1[0] or i1[1] beside a temporal
# operator, each with a run check on a sample. The one and two operator
# formulas over o1, o2 and i1, and the one operator formulas reading a fixed
# step, are a ctest entry of every release build (test_repl-ltl_sweep).
# The nightly run sweeps devel; a manual run sweeps the branch chosen in "Use
# workflow from".
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      title:
        description: >-
          Run name (default: the workflow name and the first line of the
          commit message).
        required: false
        type: string
        default: ""
      launcher:
        description: The run that started this one to name it (set by the workflow).
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

# A push or pull request run keeps the name GitHub gives it, the first line
# of its commit message. A manual or scheduled run takes the same line from
# its commit, after the workflow name (scripts/ci/name-run.sh).
run-name: "${{ github.event_name == 'workflow_dispatch' && (inputs.title || format('{0}: naming the run', github.workflow)) || github.event_name == 'schedule' && format('{0}: nightly', github.workflow) || '' }}"

# A sweep takes hours, so a newer run of the same branch replaces it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'devel' || github.ref }}
  cancel-in-progress: true

env:
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

jobs:
  # Names a manual or scheduled run after its commit (scripts/ci/name-run.sh).
  run-name:
    name: Setup · run name
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Name the run after its commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT: ${{ github.event_name }}
          TITLE: ${{ inputs.title }}
          LAUNCHER: ${{ inputs.launcher }}
        run: scripts/ci/name-run.sh name "${{ github.event_name == 'schedule' && 'devel' || github.sha }}" "${{ github.event_name == 'schedule' && 'devel' || github.ref_name }}"

  sweep:
    needs: run-name
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        mode: [ n3t, n2p ]
    name: sweep (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'devel' || github.ref }}
          submodules: recursive

      - name: Install the compiler and Spot
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 cmake ninja-build libcurl4-openssl-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-19 100
          sudo wget -q -O /usr/share/keyrings/spot-archive-keyring.gpg \
            https://www.lrde.epita.fr/repo/debian.gpg
          echo 'deb [signed-by=/usr/share/keyrings/spot-archive-keyring.gpg] https://www.lrde.epita.fr/repo/debian stable/' \
            | sudo tee /etc/apt/sources.list.d/spot.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends spot

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build tau
        run: ./dev preset release-tau -DTAU_BUILD_JOBS="$(nproc)"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Sweep
        run: python3 tests/sweep/ltl_sweep.py --tau build/release/tau --mode ${{ matrix.mode }} --jobs "$(nproc)" --run 500 --out sweep.jsonl

      - name: Keep the records
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ltl-sweep-${{ matrix.mode }}
          path: sweep.jsonl
          retention-days: 14
