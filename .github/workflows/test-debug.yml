name: Test Debug

# Manual only: the release suites cover every push, and a debug run is for
# a person who asks for one.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Commit to test: a full sha, a branch or a tag (default: the head of
          the branch chosen above).
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # Normal CI only reads the store packages; the trusted deps-store.yml owns
  # packages: write.
  packages: read

# A manual run on a commit is named after it, so the workflows that take its
# wheel find the run among those of the branch head.
run-name: ${{ inputs.commit && format('{0} on {1}', github.workflow, inputs.commit) || '' }}

env:
  # The commit a run tests: the pushed one, or the one a manual run names.
  TARGET: ${{ inputs.commit || github.sha }}
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}
  TAU_BUILD_CODEGEN_TESTS: "OFF"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux debug tests
    runs-on: ubuntu-24.04
    # A hung job fails at its timeout instead of at the six-hour limit.
    timeout-minutes: 130
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}
          # ./dev and the image build both need the parser submodule
          submodules: recursive

      # container-driver builder; required for --cache-to type=gha
      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      # A buildkit cache mount lives on the builder, and a runner is
      # discarded after the job, so the ccache directory needs a round trip
      # through the actions cache.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-ubuntu-24.04-debug-${{ env.TARGET }}
          restore-keys: |
            ccache-ubuntu-24.04-debug-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # cvc5 and boost are built from source and cached under the shared
      # 'tau-deps' scope. Change the scope name to force a rebuild.
      - name: Build deps stage (cvc5 + boost, cached)
        run: |
          ./dev docker deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-to   type=gha,scope=tau-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build debug tests and run them
        run: |
          ./dev docker build-debug \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_BUILD_CODEGEN_TESTS=${{ env.TAU_BUILD_CODEGEN_TESTS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS debug tests
    runs-on: macos-15
    timeout-minutes: 240
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
      TAU_STORE_KEEP: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}
          submodules: recursive

      # The store is content-addressed; a restored entry is reused and a miss
      # is built here with the preset's own AppleClang.
      # A claim or a half-built entry of a cancelled run must not reach the next run.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.tau/store
            !~/.tau/store/*/*.claim
            !~/.tau/store/*/*.staging-*
          key: tau-store-macos-15-debug-${{ env.TARGET }}
          restore-keys: |
            tau-store-macos-15-

      - name: Install the binding venv, spot, and coreutils
        run: |
          brew install spot coreutils
          # The venv carries the interpreter and nanobind, and the script
          # appends TAU_PYTHON to the env for the build.
          ./dev dep-python-venv

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build tau and tests, run tests (Debug)
        run: ./dev preset debug-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.tau/store
            !~/.tau/store/*/*.claim
            !~/.tau/store/*/*.staging-*
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      - name: Run tau
        run: ./build/debug/tau -v
