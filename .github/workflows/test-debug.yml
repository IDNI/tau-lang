name: Test Debug

on:
  push:
    branches: [ "devel", "devel/**" ]
  pull_request:
    branches: [ "devel", "devel/**" ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux debug tests
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          # ./dev and the image build both need the parser submodule
          submodules: recursive

      # container-driver builder; required for --cache-to type=gha
      - uses: docker/setup-buildx-action@v3

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v3

      # cvc5 and boost are built from source and cached under the shared
      # 'tau-deps' scope. Change the scope name to force a rebuild.
      - name: Build deps stage (cvc5 + boost, cached)
        run: |
          ./dev docker deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-to   type=gha,scope=tau-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build debug tests and run them
        run: |
          ./dev docker build-debug \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS bus error (targeted)
    runs-on: macos-15
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
      # bump to force a rebuild of the cached ~/.tau dependency tree
      TAU_DEPS_EPOCH: 1
      TARGETS: >-
        test_integration-blasting_correctness_check2
        test_integration-blasting_correctness_check4
        test_integration-blasting_correctness_check5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ~/.tau holds the cvc5 and boost trees; same key in every macOS job
      - name: Restore ~/.tau (cvc5 + boost)
        id: cache-tau
        uses: actions/cache/restore@v4
        with:
          path: ~/.tau
          key: tau-deps-macos-15-${{ env.TAU_DEPS_EPOCH }}-${{ hashFiles('scripts/dep-cvc5.sh', 'scripts/dep-boost.sh') }}

      - name: Build cvc5
        if: steps.cache-tau.outputs.cache-hit != 'true'
        run: ./dev dep-cvc5.sh --darwin -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Build boost
        if: steps.cache-tau.outputs.cache-hit != 'true'
        run: ./dev dep-boost.sh --darwin -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # saved here, before the build, so a failing build or test does not
      # discard the deps and force a rebuild on the next run
      - name: Save ~/.tau (cvc5 + boost)
        if: steps.cache-tau.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.tau
          key: ${{ steps.cache-tau.outputs.cache-primary-key }}

      # cmake directly rather than ./dev: only ./dev preset can pick the
      # preset, and it takes a single --target, but we want three
      - name: Configure (Debug)
        run: cmake --preset debug-all

      - name: Build only the bus error targets
        run: cmake --build build/debug -j ${{ env.TAU_BUILD_JOBS }} --target ${{ env.TARGETS }}

      - name: Stack limits (the leading SIGBUS hypothesis)
        run: |
          echo "main thread stack soft/hard (KiB): $(ulimit -s) / $(ulimit -Hs)"
          # a std::thread stack on Darwin defaults to 512 KiB, vs 8 MiB on glibc
          echo "PTHREAD_STACK_MIN: $(getconf PTHREAD_STACK_MIN)"

      - name: Run the bus error tests
        id: run
        continue-on-error: true
        run: |
          ctest --test-dir build/debug --output-on-failure --timeout 600 \
            -R 'test_integration-blasting_correctness_check[245]'

      # .ips carries the exception type and a per-thread backtrace, which
      # separates a stack overflow from every other SIGBUS cause
      - name: Dump macOS crash reports
        if: always()
        run: |
          sleep 15 # ReportCrash writes asynchronously
          found=0
          for d in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
            [ -d "$d" ] || continue
            for f in "$d"/*.ips; do
              [ -e "$f" ] || continue
              found=1
              echo "===================== $f"
              cat "$f"
            done
          done
          [ "$found" = 1 ] || echo "no crash reports found"

      - name: Backtrace under lldb
        if: always()
        run: |
          for t in ${{ env.TARGETS }}; do
            b="build/debug/$t"
            [ -x "$b" ] || continue
            echo "===================== lldb $t"
            lldb -b -o run -o 'bt all' -o 'thread info' -o quit -- "$b" 2>&1 | tail -150
          done

      - name: Fail if the bus error tests failed
        if: steps.run.outcome == 'failure'
        run: exit 1
