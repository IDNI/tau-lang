name: MacOS build

on:
  workflow_dispatch:
    inputs:
      title:
        description: >-
          Run name (default: the workflow name and the first line of the
          commit message).
        required: false
        type: string
        default: ""
      launcher:
        description: The run that started this one to name it (set by the workflow).
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

# Every run is named "<workflow>: <commit message>". A push run reads the
# message from its event, whole: an expression cannot cut it at the first
# line. A pull request run takes the title of the pull request. A manual or
# scheduled run starts again with the first line of its commit as its title
# (scripts/ci/name-run.sh).
run-name: "${{ github.event_name == 'workflow_dispatch' && (inputs.title || format('{0}: naming the run', github.workflow)) || github.event_name == 'schedule' && format('{0}: nightly', github.workflow) || github.event_name == 'pull_request' && format('{0}: {1}', github.workflow, github.event.pull_request.title) || format('{0}: {1}', github.workflow, github.event.head_commit.message || github.ref_name) }}"

env:
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

jobs:
  # Names a manual or scheduled run after its commit (scripts/ci/name-run.sh).
  run-name:
    name: Setup · run name
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Name the run after its commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT: ${{ github.event_name }}
          TITLE: ${{ inputs.title }}
          LAUNCHER: ${{ inputs.launcher }}
        run: scripts/ci/name-run.sh name build/MacOS "${{ github.ref_name }}"

  build_and_deploy:
    needs: run-name
    runs-on: macos-15
    # A hung job fails at its timeout instead of at the six-hour limit.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build/MacOS
          submodules: recursive

      # Every dependency resolves from the store, which builds a missing
      # package with the preset's AppleClang.
      # A claim or a half-built entry of a cancelled run must not reach the next run.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.tau/store
            !~/.tau/store/*/*.claim
            !~/.tau/store/*/*.staging-*
          key: tau-store-macos-15-${{ github.sha }}
          restore-keys: |
            tau-store-macos-15-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: MacOS build
        run: ./dev release

      - name: Run tau
        run: ./build-Release/tau -v

      - name: Install spot and coreutils for the test suites
        run: brew install spot coreutils

      - name: Build tests
        run: ./dev release -DTAU_BUILD_API_TESTS=ON

      - name: Run tests
        run: ./dev test-release

      # The venv carries the interpreter and nanobind, and the script appends
      # TAU_PYTHON to the env, so the build takes both from the venv.
      - name: Create the binding venv
        run: ./dev dep-python-venv

      - name: Build Python bindings
        run: ./dev binding python

      - name: Run Python test
        run: |
          "$TAU_PYTHON" ./tests/bindings/python/test_direct_api_update.py

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.tau/store
            !~/.tau/store/*/*.claim
            !~/.tau/store/*/*.staging-*
          key: ${{ steps.cache-store.outputs.cache-primary-key }}
