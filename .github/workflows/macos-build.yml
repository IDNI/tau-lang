name: MacOS build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

jobs:
  build_and_deploy:
    runs-on: macos-15
    # A hung job fails at its timeout instead of at the six-hour limit.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build/MacOS
          submodules: recursive

      # Every dependency resolves from the store, which builds a missing
      # package with the preset's AppleClang.
      # A claim or a half-built entry of a cancelled run must not reach the next run.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.tau/store
            !~/.tau/store/*/*.claim
            !~/.tau/store/*/*.staging-*
          key: tau-store-macos-15-${{ github.sha }}
          restore-keys: |
            tau-store-macos-15-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: MacOS build
        run: ./dev release

      - name: Run tau
        run: ./build-Release/tau -v

      - name: Install spot and coreutils for the test suites
        run: brew install spot coreutils

      - name: Build tests
        run: ./dev release -DTAU_BUILD_API_TESTS=ON

      - name: Run tests
        run: ./dev test-release

      # The venv carries the interpreter and nanobind, and the script appends
      # TAU_PYTHON to the env, so the build takes both from the venv.
      - name: Create the binding venv
        run: ./dev dep-python-venv

      - name: Build Python bindings
        run: ./dev binding python

      - name: Run Python test
        run: |
          "$TAU_PYTHON" ./tests/bindings/python/test_direct_api_update.py

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.tau/store
            !~/.tau/store/*/*.claim
            !~/.tau/store/*/*.staging-*
          key: ${{ steps.cache-store.outputs.cache-primary-key }}
