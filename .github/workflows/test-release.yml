name: Test Release

on:
  push:
    branches: [ "devel", "devel-*", "feature/**", "issue/**" ]
  pull_request:
    branches: [ "main", "devel", "devel-*", "feature/**", "issue/**" ]
  workflow_dispatch:

# This workflow resolves the store. A resolving job publishes what it built
# when the guard job allows it, so those jobs ask for packages: write. The
# publish runs inline, so a red test cannot strand a package. Only a push to
# devel, devel-* or main by a writer publishes. A pull request, a push to any
# other branch and a manual run never publish.
permissions:
  contents: read
  packages: read

env:
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The branch and the pusher's permission gate every publish step. GitHub
  # checks the pusher, not the commit author, so the guard reads the
  # triggering actor. A pull request never publishes.
  guard:
    name: Check the pusher's repository permission
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Read the pusher's permission
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pull request: publishing is off"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "${{ github.event_name }} run: publishing is off, only a push publishes"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.ref }}" in
            refs/heads/devel|refs/heads/devel-*|refs/heads/main) ;;
            *)
              echo "ref ${{ github.ref }}: publishing is off, only devel, devel-* and main publish"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          perm="$(gh api "repos/${{ github.repository }}/collaborators/${{ github.triggering_actor }}/permission" --jq '.permission')" \
            || echo "::warning::cannot read the permission of ${{ github.triggering_actor }}"
          echo "pusher ${{ github.triggering_actor }}: permission '${perm}'"
          case "$perm" in
            write|maintain|admin) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  probe:
    name: Choose the pack matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose the packs
        id: matrix
        run: |
          default='{"name":"default","pack":""}'
          nobv='{"name":"nobv","pack":"sbf,tau,qint"}'
          bvonly='{"name":"bvonly","pack":"sbf,tau,bv"}'
          if [ -f cmake/tau_bas.cmake ]; then
            echo "matrix={\"include\":[$default,$nobv,$bvonly]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$default]}" >> "$GITHUB_OUTPUT"
          fi

  # One job builds the system packages, so the deps job and every later image
  # import them. Change the scope to force a rebuild.
  base:
    name: Build base image (system packages)
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build base stage
        run: |
          ./dev docker base \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --cache-from type=gha,scope=tau-base \
            --cache-to   type=gha,scope=tau-base,mode=max

  # One job installs oras and the binding venv on top of the base layer, and
  # the wine layer on top of deps, so the pack matrix and the MinGW job import
  # those layers instead of each entry building them. Change the scope to force
  # a rebuild.
  deps:
    name: Build deps image (oras + venv)
    needs: base
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          # ./dev and the image build both need the parser submodule
          submodules: recursive

      # container-driver builder; required for --cache-to type=gha
      - uses: docker/setup-buildx-action@v4

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build deps stage
        run: |
          ./dev docker deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-to   type=gha,scope=tau-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # w64-deps adds the wine layer the MinGW job needs. It sits on top of
      # deps, so this job has the layers the build stage needs to reuse.
      - name: Build w64-deps stage
        run: |
          ./dev docker w64-deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-w64-deps \
            --cache-to   type=gha,scope=tau-w64-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Linux release tests (${{ matrix.name }})
    needs: [guard, probe, deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # ./dev and the image build both need the parser submodule
          submodules: recursive

      # container-driver builder; required for type=gha cache
      - uses: docker/setup-buildx-action@v4

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      # A buildkit cache mount lives on the builder, and a runner is
      # discarded after the job, so the ccache directory needs a round trip
      # through the actions cache.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-ubuntu-24.04-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-24.04-${{ matrix.name }}-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # Configure publishes each store entry as soon as it builds it, so a
      # red test cannot strand a package.
      - name: Resolve the store packages
        run: |
          ./dev docker build-release-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --build-arg TAU_BAS=${{ matrix.pack }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-to   type=gha,scope=tau-release-${{ matrix.name }},mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Each pack writes its own tau_pack.h, so each entry is a full build
      # on top of the layers the resolve step cached. The same
      # TAU_STORE_PUBLISH keeps the resolve layer a cache hit.
      - name: Build release tests and run them
        run: |
          ./dev docker build-release \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --build-arg TAU_BAS=${{ matrix.pack }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-release-${{ matrix.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The native arm64 gate. It builds its own deps layer in the arm container,
  # so it does not depend on the x86 `deps` job or its cache scope.
  linux-arm64:
    name: Linux arm64 release tests (${{ matrix.name }})
    needs: [guard, probe]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    env:
      # ubuntu-24.04-arm runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-ubuntu-24.04-arm-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-24.04-arm-${{ matrix.name }}-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      - name: Resolve the store packages
        run: |
          ./dev docker build-release-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --build-arg TAU_BAS=${{ matrix.pack }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-to   type=gha,scope=tau-release-arm-${{ matrix.name }},mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release tests and run them
        run: |
          ./dev docker build-release \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --build-arg TAU_BAS=${{ matrix.pack }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-release-arm-${{ matrix.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The cross gate builds the same preset on x86 and runs it under qemu. The
  # host spot keeps ltlsynt off the arm64 store package, which this host cannot
  # execute. It builds and runs the Python binding too, so it registers qemu
  # for the arm64 binaries and makes an arm64 venv for the interpreter.
  linux-arm64-cross:
    name: Linux arm64 cross tests
    needs: [guard, probe]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A test that starts an arm64 child reaches binfmt, and QEMU_LD_PREFIX
      # is set for those children, so the handler must be registered before
      # anything runs an arm64 binary. The action registers it with the
      # fix-binary flag, which does not need systemd-binfmt on the runner.
      - name: Register qemu for the arm64 binaries
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # The default archive serves amd64 only, so the arm64 packages come from
      # the ports archive and the default sources are pinned to amd64.
      - name: Enable the arm64 multiarch sources
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i -E 's/^Types: (deb|deb-src)$/&\nArchitectures: amd64/' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Architectures: arm64
          EOF
          sudo apt-get update

      # The venv step runs the arm64 interpreter outside ctest, so it needs
      # the loader prefix that cmake/tau-cross-test-environment.cmake gives
      # only to the tests.
      - name: Install the cross toolchain and the arm64 venv
        env:
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
        run: |
          ./dev setup-ubuntu-ci-deps.sh
          # The arm64 toolchain seeds FindPython from the interpreter in
          # TAU_PYTHON (cmake/toolchains/aarch64-linux-gnu.cmake), so no arm64
          # Python headers are installed here.
          sudo apt-get install -y --no-install-recommends \
            clang g++-aarch64-linux-gnu qemu-user
          # The interpreter and nanobind come from the arm64 venv, which the
          # binfmt registration above makes runnable. TAU_PYTHON arrives in
          # later steps through GITHUB_ENV.
          ./dev dep-python-venv -DTAU_PYTHON_ARCH=aarch64

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-linux-arm64-cross-${{ github.sha }}
          restore-keys: |
            tau-store-linux-arm64-cross-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build the arm64 tests and the binding, run them under qemu
        run: ./dev preset release-arm64-all run -DTAU_BUILD_JOBS=${{ env.BUILD_JOBS }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      # Configure resolved the store before any test ran, so a red test still
      # publishes what this job built.
      - name: Publish the store packages
        if: ${{ !cancelled() && needs.guard.outputs.allowed == 'true' }}
        run: ./dev store-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The MinGW gate builds the Windows pack in the w64 image and runs its
  # suite under wine. It runs the default pack only.
  linux-mingw64-wine:
    name: MinGW-w64 release tests (wine)
    needs: [guard, deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-ubuntu-24.04-mingw64-wine-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-24.04-mingw64-wine-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      - name: Resolve the store packages
        run: |
          ./dev docker w64-build-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-w64-deps \
            --cache-to   type=gha,scope=tau-w64-build,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the MinGW tests and run them under wine
        run: |
          ./dev docker w64-build \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TESTS=yes \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-w64-deps \
            --cache-from type=gha,scope=tau-w64-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  testnet:
    name: tau-testnet suite
    needs: [guard, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # ./dev and the image build both need the parser submodule
          submodules: recursive

      # container-driver builder; required for type=gha cache
      - uses: docker/setup-buildx-action@v4

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      # The default pack entry of the linux job writes this cache, so the
      # key names default. This job only reads, to avoid a duplicate save.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: ccache-ubuntu-24.04-default-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-24.04-default-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # tau-testnet's specs use bv, so this suite only runs against the default pack
      - name: Run the tau-testnet suite
        run: |
          ./dev docker test-with-testnet \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-release-default
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job builds emsdk and the browser test dependencies, so the wasm gates
  # import them instead of each gate building them. Change the scope to force
  # a rebuild. These gates build the distributable wasm pack only; the wasm
  # dependencies resolve from the local store at configure time
  # (cmake/tau-deps.cmake), never the older ~/.tau dist path.
  wasm-deps:
    name: Build wasm deps images (emsdk, Chrome)
    needs: [guard, deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build wasm-deps and wasm-browser-deps stages
        run: |
          ./dev docker wasm-browser-deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-to   type=gha,scope=tau-wasm-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wasm-node:
    name: WebAssembly (Node.js)
    needs: [guard, wasm-deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Resolve the store packages
        run: |
          ./dev docker wasm-node-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-to   type=gha,scope=tau-wasm-node,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: |
          ./dev docker wasm-node \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-from type=gha,scope=tau-wasm-node
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wasm-browser:
    name: WebAssembly (browser)
    # The browser stage copies the store from wasm-node-resolve. That job's
    # resolve step writes those layers to tau-wasm-node, so waiting for it turns
    # the copy into a cache hit instead of a full rebuild.
    needs: [guard, wasm-deps, wasm-node]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test
        run: |
          ./dev docker wasm-browser \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-from type=gha,scope=tau-wasm-node
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The address sanitizer gate runs natively, so it needs no image. It runs
  # on the devel branches and by hand only, because it is slow.
  linux-asan:
    name: Linux release tests (address sanitizer)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'devel'))
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      TAU_BUILD_JOBS: 4
      TAU_STORE_KEEP: 3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-ubuntu-24.04-asan-${{ github.sha }}
          restore-keys: |
            tau-store-ubuntu-24.04-asan-

      - name: Install the build dependencies
        run: |
          ./dev setup-ubuntu-ci-deps.sh
          sudo apt-get install -y --no-install-recommends clang

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build the tests with the address sanitizer and run them
        run: ./dev preset release-asan-tests run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

  macos:
    name: macOS release tests
    needs: guard
    runs-on: macos-15
    permissions:
      contents: read
      packages: write
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
      TAU_STORE_KEEP: 3
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The store is content-addressed, so a restored entry is reused and a
      # miss is built here with the preset's own AppleClang. The key does not
      # need to describe the recipes: a stale key costs a rebuild, never a
      # wrong package.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-macos-15-${{ github.sha }}
          restore-keys: |
            tau-store-macos-15-

      - name: Install the binding venv, spot, and coreutils
        run: |
          brew install spot coreutils
          # The venv carries the interpreter and nanobind, and the script
          # appends TAU_PYTHON to the env for the build.
          ./dev dep-python-venv

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build tau and tests, run tests (Release)
        env:
          # Apple clang prints no stack dump. A crash leaves a preprocessed
          # reproducer here, and that is the only trace of it.
          CLANG_CRASH_DIAGNOSTICS_DIR: ${{ runner.temp }}/clang-crash
        run: |
          mkdir -p "$CLANG_CRASH_DIAGNOSTICS_DIR"
          ./dev preset release-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # Configure resolved the store before any test ran, so a red test still
      # publishes what this job built.
      - name: Publish the store packages
        if: ${{ !cancelled() && needs.guard.outputs.allowed == 'true' }}
        run: ./dev store-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # saved after the run, so a build failure still keeps the packages that
      # did resolve and the next run does not rebuild them
      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      - name: Collect the compiler crash reports
        if: failure()
        run: |
          d="${{ runner.temp }}/clang-crash"
          cp ~/Library/Logs/DiagnosticReports/clang* "$d"/ 2>/dev/null || true
          ls -la "$d"
          for f in "$d"/*.ips "$d"/*.crash; do
            [ -f "$f" ] || continue
            echo "== $f"
            cat "$f"
          done

      - name: Upload the compiler crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-clang-crash
          path: ${{ runner.temp }}/clang-crash
          if-no-files-found: ignore

      - name: Run tau
        run: ./build/release/tau -v

  # The MSVC target now builds cvc5 (bv and hsb), nlang (store curl) and the
  # full test suite, all resolved from the preset's own compiler; a miss is
  # built here and cached. The MSVC shell comes from ilammy/msvc-dev-cmd, so
  # the producers' vcvars64.bat search is only a local fallback.
  windows:
    name: Windows release (${{ matrix.preset }})
    needs: guard
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    # The two presets write different store ids, so each entry keeps its own
    # store cache.
    strategy:
      fail-fast: false
      matrix:
        preset: [release-msvc-all, release-msvc-all-clang-cl]
    defaults:
      run:
        shell: bash
    env:
      TAU_BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: seanmiddleditch/gha-setup-ninja@v6

      # The venv carries the binding's interpreter and appends TAU_PYTHON for
      # the build. It needs no cl.exe, so it runs before the dev prompt.
      - name: Create the binding venv
        run: ./dev dep-python-venv

      # cl.exe is on PATH only inside a developer command prompt.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-windows-latest-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            tau-store-windows-latest-${{ matrix.preset }}-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # The Spot package is a host tool built with MSYS2 UCRT64 g++ (nothing
      # links it); the runner ships MSYS2 but not always this toolchain.
      - name: Install the MSYS2 UCRT64 toolchain
        if: steps.cache-store.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc make"

      - name: Build and test tau (${{ matrix.preset }})
        run: ./dev preset ${{ matrix.preset }} run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # Configure resolved the store before any test ran, so a red test still
      # publishes what this job built.
      - name: Publish the store packages
        if: ${{ !cancelled() && needs.guard.outputs.allowed == 'true' }}
        run: ./dev store-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

