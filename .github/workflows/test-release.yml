name: Test Release

on:
  push:
    branches: [ "devel", "devel-*", "feature/**", "issue/**" ]
  pull_request:
    branches: [ "main", "devel", "devel-*", "feature/**", "issue/**" ]
  workflow_dispatch:

# One resolve job for each store target builds what the remote lacks. When the
# guard job allows it, configure publishes each entry right after it builds
# it, so a later failure cannot lose it, and only those jobs ask for
# packages: write. Only a push or a manual run on devel, devel-* or main by a
# writer publishes. A pull request and a run on any other branch never publish.
permissions:
  contents: read
  packages: read

env:
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The branch and the pusher's permission gate every publish. GitHub
  # checks the pusher, not the commit author, so the guard reads the
  # triggering actor. A pull request never publishes.
  guard:
    name: Setup · pusher permission
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Read the pusher's permission
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pull request: publishing is off"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.event_name }}" in
            push|workflow_dispatch) ;;
            *)
              echo "${{ github.event_name }} run: publishing is off, only a push or a manual run publishes"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          case "${{ github.ref }}" in
            refs/heads/devel|refs/heads/devel-*|refs/heads/main) ;;
            *)
              echo "ref ${{ github.ref }}: publishing is off, only devel, devel-* and main publish"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          perm="$(gh api "repos/${{ github.repository }}/collaborators/${{ github.triggering_actor }}/permission" --jq '.permission')" \
            || echo "::warning::cannot read the permission of ${{ github.triggering_actor }}"
          echo "pusher ${{ github.triggering_actor }}: permission '${perm}'"
          case "$perm" in
            write|maintain|admin) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  probe:
    name: Setup · pack matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # The matrix holds the pack name only, because GitHub appends every
      # matrix value to the job name. The test job maps the name to TAU_BAS.
      - name: Choose the packs
        id: matrix
        run: |
          if [ -f cmake/tau_bas.cmake ]; then
            echo 'matrix={"name":["default","nobv","bvonly"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"name":["default"]}' >> "$GITHUB_OUTPUT"
          fi

  # The Linux x86_64 environment: the system base, the deps image and the
  # store packages, one build each, so each cache scope keeps one writer.
  # It publishes the packages it builds before any test job runs, so a failed
  # test keeps the publish. The resolve layer is not cached: the test jobs
  # pull the store from the remote.
  linux-resolve:
    name: Linux x86_64 · environment
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build the base stage
        run: |
          ./dev docker base \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-to   type=gha,scope=tau-base,mode=min
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tau-base holds the base layers only, so the deps layers come from their
      # own scope.
      - name: Build the deps stage
        run: |
          ./dev docker deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-to   type=gha,scope=tau-deps,mode=min
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and publish the store packages
        run: |
          ./dev docker linux-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Linux x86_64 test jobs read the tool layers of the environment and pull
  # the store the environment published. Each pack writes its own tau_pack.h,
  # so each entry is a full build. GitHub appends the pack name to the job
  # name.
  linux:
    name: Linux x86_64 · tests
    needs: [guard, probe, linux-resolve]
    runs-on: ubuntu-24.04
    # The default entry publishes the tau-wheel package, which no other job
    # builds.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ matrix.name == 'default' && needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
      # An empty value keeps the default pack.
      PACK: ${{ matrix.name == 'nobv' && 'sbf,tau,qint' || matrix.name == 'bvonly' && 'sbf,tau,bv' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      # A buildkit cache mount lives on the builder, and a runner is
      # discarded after the job, so the ccache directory needs a round trip
      # through the actions cache.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.name }}-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      - name: Build and test
        run: |
          ./dev docker build-release \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_BAS=${{ env.PACK }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The wheel reuses the compiled tree of the step above. It runs after a
      # red test too, so the testnet job still gets a wheel.
      - name: Pack and publish the tau wheel
        if: ${{ !cancelled() && matrix.name == 'default' }}
        run: |
          ./dev docker tau-wheel \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_BAS=${{ env.PACK }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAU_WHEEL_DIR: tau-wheel

      # A pull request cannot publish, so the artifact hands the wheel on.
      - name: Upload the tau wheel
        if: ${{ !cancelled() && matrix.name == 'default' }}
        uses: actions/upload-artifact@v7
        with:
          name: tau-wheel
          path: tau-wheel/
          if-no-files-found: error

  # The devel build keeps assert() and DBG(...) live, which the release build
  # removes. It pulls the release packages the environment published, so it
  # builds none, needs no guard and publishes nothing.
  linux-devel:
    name: Linux x86_64 · tests (devel)
    needs: linux-resolve
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-devel-${{ github.sha }}
          restore-keys: |
            ccache-linux-devel-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # No --cache-to: the test layer changes with every commit.
      - name: Build and test
        run: |
          ./dev docker linux-devel \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every other Linux job builds with clang. This job builds the library with
  # gcc, so a gcc error shows in a job of its own. It pulls the packages the
  # environment published, so it builds none and publishes nothing.
  linux-gcc:
    name: Linux x86_64 · tests (gcc)
    needs: linux-resolve
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-gcc-${{ github.sha }}
          restore-keys: |
            ccache-linux-gcc-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # No --cache-to: the build layer changes with every commit.
      - name: Build
        run: |
          ./dev docker linux-gcc \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # tau-testnet's specs use bv, so this suite runs on the wheel of the default
  # pack. It takes the tau-wheel store package when the remote has it, else the
  # artifact of the same wheel, and compiles nothing.
  testnet:
    name: Linux x86_64 · tests (tau-testnet)
    needs: linux
    if: ${{ !cancelled() && needs.linux.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Download the tau wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: tau-wheel
          path: tau-wheel-artifact

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # store-remote.sh verifies a pulled entry before it imports it.
      - name: Take the wheel from the store, else from the artifact
        run: |
          id="$(cat tau-wheel-artifact/store-id)"
          mkdir -p tau-wheel
          if external/parser/scripts/store-remote.sh pull "$HOME/.tau" "tau-wheel/${id}"; then
            echo "tau-wheel ${id}: from the store"
            cp "$HOME/.tau/store/tau-wheel/${id}/prefix"/tau_nanobind-*.whl tau-wheel/
          else
            echo "tau-wheel ${id}: not on the remote, from the artifact"
            cp tau-wheel-artifact/tau_nanobind-*.whl tau-wheel/
          fi

      - name: Run the tau-testnet suite
        run: |
          ./dev docker test-with-testnet \
            --cache-from type=gha,scope=tau-base
        env:
          TAU_WHEEL_DIR: tau-wheel

  # The address sanitizer job builds on the environment's tool layers.
  # release-asan sets TAU_LTO=OFF, which moves the parser SDK id, so this job
  # publishes that one package. It runs on the devel branches and by hand
  # only: it is slow.
  linux-asan:
    name: Linux x86_64 · tests (asan)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'devel'))
    needs: [guard, linux-resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-asan-${{ github.sha }}
          restore-keys: |
            ccache-linux-asan-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # No --cache-to: the test layer changes with every commit.
      - name: Build and test
        run: |
          ./dev docker asan \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The WebAssembly environment: emsdk and the browser test dependencies, so
  # the wasm test jobs import them instead of each one building them. It sits
  # on the deps stage of the Linux x86_64 environment. Change the scope to
  # force a rebuild.
  wasm-deps:
    name: WebAssembly · environment
    needs: linux-resolve
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      # mode=min keeps the layers of the final target only, so each slow stage
      # is the target of its own build and has its own scope.
      - name: Build the wasm-deps stage
        run: |
          ./dev docker wasm-deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-to   type=gha,scope=tau-wasm-deps,mode=min
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the wasm-browser-deps stage
        run: |
          ./dev docker wasm-browser-deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-from type=gha,scope=tau-wasm-browser-deps \
            --cache-to   type=gha,scope=tau-wasm-browser-deps,mode=min
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The wasm32-emscripten resolver and the node tests. Its resolve stage copies
  # the store of the Linux x86_64 environment for the native parity tau and
  # the host tools, so it waits for that job and pulls its packages.
  wasm-node:
    name: WebAssembly · tests (node)
    needs: [guard, wasm-deps, linux-resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Resolve and publish the store packages
        run: |
          ./dev docker wasm-node-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: |
          ./dev docker wasm-node \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The browser stage copies the store from wasm-node-resolve, so it waits for
  # the node test job, which publishes the wasm packages. It does not wait for
  # the Linux x86_64 test jobs.
  wasm-browser:
    name: WebAssembly · tests (browser)
    needs: [wasm-deps, wasm-node, linux-resolve]
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test
        run: |
          ./dev docker wasm-browser \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-wasm-browser-deps \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Windows MinGW environment: the wine and MinGW layers (w64-deps) and the
  # windows-x86_64-mingw store packages. It publishes before the tests, so a
  # failed wine test keeps the mingw packages. Its stage copies the store of
  # the Linux x86_64 environment for the host tools, so it waits for that job.
  linux-mingw64-wine-resolve:
    name: Windows MinGW · environment
    needs: [guard, linux-resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      # mode=min keeps the layers of the final target only, so the wine and
      # MinGW stage is the target of its own build.
      - name: Build the w64-deps stage
        run: |
          ./dev docker w64-deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-mingw64-wine-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base \
            --cache-to   type=gha,scope=tau-mingw64-wine-deps,mode=min
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and publish the store packages
        run: |
          ./dev docker w64-build-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-mingw64-wine-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The mingw test job reads the tool layers of its environment and pulls the
  # store the environment published. It runs the default pack only, and
  # only the REPL suite under wine: the native jobs run the C++ suite.
  linux-mingw64-wine:
    name: Windows MinGW · tests (wine)
    needs: linux-mingw64-wine-resolve
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-mingw64-wine-${{ github.sha }}
          restore-keys: |
            ccache-linux-mingw64-wine-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      - name: Build and test
        run: |
          ./dev docker w64-build \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TESTS=yes \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-mingw64-wine-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Linux arm64 environment. The same image as the x86_64 environment on
  # an arm runner, so the arm64 store packages are built natively. It reads
  # and writes the arm64 scope only: the x86 layers never match an arm runner.
  linux-arm64-resolve:
    name: Linux arm64 · environment
    needs: guard
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04-arm runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      # The deps stage holds the base layers too, so one arm64 scope covers
      # both.
      - name: Build the deps stage
        run: |
          ./dev docker deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-linux-arm64-deps \
            --cache-to   type=gha,scope=tau-linux-arm64-deps,mode=min
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and publish the store packages
        run: |
          ./dev docker linux-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-linux-arm64-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The native arm64 test job reads the tool layers of its environment and
  # pulls the store the environment published. The pack matrix runs on
  # x86_64 only, so arm64 checks the platform with the default pack.
  linux-arm64:
    name: Linux arm64 · tests
    needs: linux-arm64-resolve
    runs-on: ubuntu-24.04-arm
    env:
      # ubuntu-24.04-arm runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-arm64-${{ github.sha }}
          restore-keys: |
            ccache-linux-arm64-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      - name: Build and test
        run: |
          ./dev docker build-release \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-linux-arm64-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The cross gate builds the arm64 suite on x86 in the Linux image and runs it
  # under qemu. Its stage starts from linux-resolve, so the host packages are
  # hits, and it resolves and publishes the cross arm64 packages.
  linux-arm64-cross:
    name: Linux arm64 · tests (cross, qemu)
    needs: [guard, linux-resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The build container runs arm64 binaries through the host's binfmt
      # handler. The action registers it with the fix-binary flag, so the
      # handler works inside the container too.
      - name: Register qemu for the arm64 binaries
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-arm64-cross-${{ github.sha }}
          restore-keys: |
            ccache-linux-arm64-cross-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # No --cache-to: the test layer changes with every commit.
      - name: Resolve, build and test under qemu
        run: |
          ./dev docker linux-arm64-cross \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Windows MSVC environment: the windows-x86_64-msvc store. cl.exe and
  # clang-cl record a different compiler in the package id, so this job
  # resolves both id sets once and saves the store. The test matrix below
  # needs it and restores that store.
  windows-msvc-store:
    name: Windows MSVC · environment
    needs: guard
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      # windows-latest runners are 4-core
      TAU_BUILD_JOBS: 4
      # Configure publishes each store entry right after it builds it.
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # The -all presets configure the binding, so configure needs the venv
      # interpreter. It needs no cl.exe, so it runs before the dev prompt.
      - name: Create the binding venv
        run: ./dev dep-python-venv

      # clang-cl uses the MSVC headers and libraries, so both presets need
      # this environment.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-windows-latest-${{ github.sha }}
          restore-keys: |
            tau-store-windows-latest-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # The Spot package is a host tool built with MSYS2 UCRT64 g++ (nothing
      # links it); the runner ships MSYS2 but not always this toolchain.
      - name: Install the MSYS2 UCRT64 toolchain
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc make"

      - name: Resolve the cl.exe store packages
        run: ./dev preset release-msvc-all --configure-only -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Resolve the clang-cl store packages
        run: ./dev preset release-msvc-all-clang-cl --configure-only -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # Saved even after a failure, so the next run keeps what did resolve.
      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

  # The name holds no matrix value: GitHub appends (cl) or (clang-cl) itself,
  # and a skipped job shows no unexpanded template.
  windows-msvc:
    name: Windows MSVC · tests
    needs: windows-msvc-store
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # windows-latest runners are 4-core
      TAU_BUILD_JOBS: 4
      PRESET: ${{ matrix.compiler == 'clang-cl' && 'release-msvc-all-clang-cl' || 'release-msvc-all' }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [cl, clang-cl]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Create the binding venv
        run: ./dev dep-python-venv

      # clang-cl uses the MSVC headers and libraries, so both presets need
      # this environment.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The environment job saved this key for the same commit. Only that job
      # saves it, so the two matrix entries do not race on one key.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-windows-latest-${{ github.sha }}
          restore-keys: |
            tau-store-windows-latest-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Only a store miss builds the Spot package, which needs this toolchain.
      - name: Install the MSYS2 UCRT64 toolchain
        if: steps.cache-store.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc make"

      # Git Bash runs ./dev, and the preset carries the compiler choice.
      - name: Build and test
        run: ./dev preset "$PRESET" run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

  # The darwin-arm64 environment: resolves and publishes the store and saves it
  # for the tests job below. A miss builds with the preset's own AppleClang.
  macos-arm64-store:
    name: macOS arm64 · environment
    needs: guard
    runs-on: macos-15
    permissions:
      contents: read
      packages: write
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
      TAU_STORE_KEEP: 3
      # Configure publishes each store entry right after it builds it.
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The store is content-addressed, so a stale key costs a rebuild, never
      # a wrong package.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-macos-arm64-${{ github.sha }}
          restore-keys: |
            tau-store-macos-arm64-

      - name: Install the binding venv, spot, and coreutils
        run: |
          brew install spot coreutils
          # The -all preset configures the binding, so configure needs the
          # venv interpreter.
          ./dev dep-python-venv

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve the store packages
        run: ./dev preset release-all --configure-only -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # Saved even after a failure, so the next run keeps what did resolve.
      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

  macos-arm64:
    name: macOS arm64 · tests
    needs: macos-arm64-store
    runs-on: macos-15
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The environment job saved this key for the same commit. An exact hit
      # holds every package, so configure never reads the remote.
      - name: Restore the dependency store (~/.tau/store)
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-macos-arm64-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Install the binding venv, spot, and coreutils
        run: |
          brew install spot coreutils
          ./dev dep-python-venv

      - name: Build tau and tests, run tests (Release)
        env:
          # Apple clang prints no stack dump. A crash leaves a preprocessed
          # reproducer here, and that is the only trace of it.
          CLANG_CRASH_DIAGNOSTICS_DIR: ${{ runner.temp }}/clang-crash
        run: |
          mkdir -p "$CLANG_CRASH_DIAGNOSTICS_DIR"
          ./dev preset release-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Collect the compiler crash reports
        if: failure()
        run: |
          d="${{ runner.temp }}/clang-crash"
          cp ~/Library/Logs/DiagnosticReports/clang* "$d"/ 2>/dev/null || true
          ls -la "$d"
          for f in "$d"/*.ips "$d"/*.crash; do
            [ -f "$f" ] || continue
            echo "== $f"
            cat "$f"
          done

      - name: Upload the compiler crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-clang-crash
          path: ${{ runner.temp }}/clang-crash
          if-no-files-found: ignore

      - name: Run tau
        run: ./build/release/tau -v

  # The darwin-x86_64 environment: resolves and publishes the store and saves it
  # for the tests job below. A miss builds with the preset's own AppleClang.
  macos-x86_64-store:
    name: macOS x86_64 · environment
    needs: guard
    runs-on: macos-15-intel
    permissions:
      contents: read
      packages: write
    env:
      # macos-15-intel runners are 4-core x86_64
      TAU_BUILD_JOBS: 4
      TAU_STORE_KEEP: 3
      # Configure publishes each store entry right after it builds it.
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The store is content-addressed, so a stale key costs a rebuild, never
      # a wrong package.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-macos-x86_64-${{ github.sha }}
          restore-keys: |
            tau-store-macos-x86_64-

      - name: Install the binding venv, spot, and coreutils
        run: |
          brew install spot coreutils
          # The -all preset configures the binding, so configure needs the
          # venv interpreter.
          ./dev dep-python-venv

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve the store packages
        run: ./dev preset release-all --configure-only -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # Saved even after a failure, so the next run keeps what did resolve.
      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

  macos-x86_64:
    name: macOS x86_64 · tests
    needs: macos-x86_64-store
    runs-on: macos-15-intel
    env:
      # macos-15-intel runners are 4-core x86_64
      TAU_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The environment job saved this key for the same commit. An exact hit
      # holds every package, so configure never reads the remote.
      - name: Restore the dependency store (~/.tau/store)
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-macos-x86_64-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Install the binding venv, spot, and coreutils
        run: |
          brew install spot coreutils
          ./dev dep-python-venv

      - name: Build tau and tests, run tests (Release)
        env:
          # Apple clang prints no stack dump. A crash leaves a preprocessed
          # reproducer here, and that is the only trace of it.
          CLANG_CRASH_DIAGNOSTICS_DIR: ${{ runner.temp }}/clang-crash
        run: |
          mkdir -p "$CLANG_CRASH_DIAGNOSTICS_DIR"
          ./dev preset release-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Collect the compiler crash reports
        if: failure()
        run: |
          d="${{ runner.temp }}/clang-crash"
          cp ~/Library/Logs/DiagnosticReports/clang* "$d"/ 2>/dev/null || true
          ls -la "$d"
          for f in "$d"/*.ips "$d"/*.crash; do
            [ -f "$f" ] || continue
            echo "== $f"
            cat "$f"
          done

      - name: Upload the compiler crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64-clang-crash
          path: ${{ runner.temp }}/clang-crash
          if-no-files-found: ignore

      - name: Run tau
        run: ./build/release/tau -v

  # A ccache or store key ends in the commit, so every run adds an entry. This
  # job keeps the newest entry of each key on this ref and deletes the rest. A
  # failed job saves no ccache, so its newest entry is the last good one.
  cache-cleanup:
    name: Cleanup · old cache entries
    needs: [linux, linux-devel, linux-gcc, linux-asan, linux-mingw64-wine,
      linux-arm64, linux-arm64-cross, windows-msvc-store, macos-arm64-store,
      macos-x86_64-store]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Keep the newest entry of each ccache and store key
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Newest first. The key without its commit is the job's prefix.
          gh api --paginate "repos/${REPO}/actions/caches?ref=${REF}&per_page=100" \
            --jq '.actions_caches[]
              | select(.key | test("^(ccache-|tau-store-).*-[0-9a-f]{40}$"))
              | [.created_at, .id, .key] | @tsv' \
            | sort -r \
            | awk -F '\t' '{ p = $3; sub(/-[0-9a-f]+$/, "", p) } seen[p]++ { print $2 "\t" $3 }' \
            | while IFS=$'\t' read -r id key; do
                echo "delete ${key}"
                gh api -X DELETE "repos/${REPO}/actions/caches/${id}"
              done
