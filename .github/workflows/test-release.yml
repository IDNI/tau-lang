name: Test Release

on:
  push:
    branches: [ "devel", "devel-*", "feature/**", "issue/**" ]
  pull_request:
    branches: [ "main", "devel", "devel-*", "feature/**", "issue/**" ]
  workflow_dispatch:

# One resolve job for each store target builds what the remote lacks. When the
# guard job allows it, configure publishes each entry right after it builds
# it, so a later failure cannot lose it, and only those jobs ask for
# packages: write. Only a push or a manual run on devel, devel-* or main by a
# writer publishes. A pull request and a run on any other branch never publish.
permissions:
  contents: read
  packages: read

env:
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The branch and the pusher's permission gate every publish. GitHub
  # checks the pusher, not the commit author, so the guard reads the
  # triggering actor. A pull request never publishes.
  guard:
    name: Check the pusher's repository permission
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Read the pusher's permission
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pull request: publishing is off"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.event_name }}" in
            push|workflow_dispatch) ;;
            *)
              echo "${{ github.event_name }} run: publishing is off, only a push or a manual run publishes"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          case "${{ github.ref }}" in
            refs/heads/devel|refs/heads/devel-*|refs/heads/main) ;;
            *)
              echo "ref ${{ github.ref }}: publishing is off, only devel, devel-* and main publish"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          perm="$(gh api "repos/${{ github.repository }}/collaborators/${{ github.triggering_actor }}/permission" --jq '.permission')" \
            || echo "::warning::cannot read the permission of ${{ github.triggering_actor }}"
          echo "pusher ${{ github.triggering_actor }}: permission '${perm}'"
          case "$perm" in
            write|maintain|admin) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  probe:
    name: Choose the pack matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose the packs
        id: matrix
        run: |
          default='{"name":"default","pack":""}'
          nobv='{"name":"nobv","pack":"sbf,tau,qint"}'
          bvonly='{"name":"bvonly","pack":"sbf,tau,bv"}'
          if [ -f cmake/tau_bas.cmake ]; then
            echo "matrix={\"include\":[$default,$nobv,$bvonly]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$default]}" >> "$GITHUB_OUTPUT"
          fi

  # One job builds the system base and the wine layers, so the image builds
  # import them instead of each one building them. w64-deps sits on top of
  # deps, so this job builds deps too. Change the scope to force a rebuild.
  base:
    name: Build base images (system, wine)
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build base and w64-deps stages
        run: |
          ./dev docker w64-deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-to   type=gha,scope=tau-base,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job builds the oras and binding venv layer, so the store-reading builds
  # import it instead of each one installing it.
  deps:
    name: Build deps image (oras, venv)
    # Reads the tau-base cache, so it waits for base instead of building the
    # same layers beside it.
    needs: base
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build deps stage
        run: |
          ./dev docker deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-to   type=gha,scope=tau-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The linux-x86_64 resolver: it reads the store, builds what is missing and
  # publishes it, so the test jobs resolve nothing and a failed test keeps the
  # publish. A pull request, which cannot publish, gets the store through the
  # layer cache.
  linux-resolve:
    name: Linux store (x86_64)
    needs: [guard, deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Resolve and publish the store packages
        run: |
          ./dev docker linux-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base \
            --cache-to   type=gha,scope=tau-linux-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The linux-x86_64 test jobs read the resolver's layers, so the store is a
  # cache hit and nothing resolves here. Each pack writes its own tau_pack.h,
  # so each entry is a full build.
  linux:
    name: Linux (${{ matrix.name }})
    needs: [guard, probe, linux-resolve]
    runs-on: ubuntu-24.04
    # The default entry publishes the tau-wheel package, which no other job
    # builds.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ matrix.name == 'default' && needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      # A buildkit cache mount lives on the builder, and a runner is
      # discarded after the job, so the ccache directory needs a round trip
      # through the actions cache.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.name }}-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      - name: Build and test
        run: |
          ./dev docker build-release \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_BAS=${{ matrix.pack }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-linux-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The wheel reuses the compiled tree of the step above. It runs after a
      # red test too, so the testnet job still gets a wheel.
      - name: Pack and publish the tau wheel
        if: ${{ !cancelled() && matrix.name == 'default' }}
        run: |
          ./dev docker tau-wheel \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_BAS=${{ matrix.pack }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-linux-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAU_WHEEL_DIR: tau-wheel

      # A pull request cannot publish, so the artifact hands the wheel on.
      - name: Upload the tau wheel
        if: ${{ !cancelled() && matrix.name == 'default' }}
        uses: actions/upload-artifact@v7
        with:
          name: tau-wheel
          path: tau-wheel/
          if-no-files-found: error

  # The devel build keeps assert() and DBG(...) live, which the release build
  # removes. It reads the release packages from the resolver's layers, so it
  # resolves nothing, needs no guard and publishes nothing.
  linux-devel:
    name: Linux (devel)
    needs: linux-resolve
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-devel-${{ github.sha }}
          restore-keys: |
            ccache-linux-devel-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # No --cache-to: the test layer changes with every commit.
      - name: Build and test
        run: |
          ./dev docker linux-devel \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-linux-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # tau-testnet's specs use bv, so this suite runs on the wheel of the default
  # pack. It takes the tau-wheel store package when the remote has it, else the
  # artifact of the same wheel, and compiles nothing.
  testnet:
    name: Linux (tau-testnet)
    needs: linux
    if: ${{ !cancelled() && needs.linux.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Download the tau wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: tau-wheel
          path: tau-wheel-artifact

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # store-remote.sh verifies a pulled entry before it imports it.
      - name: Take the wheel from the store, else from the artifact
        run: |
          id="$(cat tau-wheel-artifact/store-id)"
          mkdir -p tau-wheel
          if external/parser/scripts/store-remote.sh pull "$HOME/.tau" "tau-wheel/${id}"; then
            echo "tau-wheel ${id}: from the store"
            cp "$HOME/.tau/store/tau-wheel/${id}/prefix"/tau_nanobind-*.whl tau-wheel/
          else
            echo "tau-wheel ${id}: not on the remote, from the artifact"
            cp tau-wheel-artifact/tau_nanobind-*.whl tau-wheel/
          fi

      - name: Run the tau-testnet suite
        run: |
          ./dev docker test-with-testnet \
            --cache-from type=gha,scope=tau-base
        env:
          TAU_WHEEL_DIR: tau-wheel

  # The address sanitizer job builds on the resolver's layers. release-asan
  # sets TAU_LTO=OFF, which moves the parser SDK id, so this job publishes that
  # one package. It runs on the devel branches and by hand only: it is slow.
  linux-asan:
    name: Linux (address sanitizer)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'devel'))
    needs: [guard, linux-resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-asan-${{ github.sha }}
          restore-keys: |
            ccache-linux-asan-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # No --cache-to: the test layer changes with every commit.
      - name: Build and test
        run: |
          ./dev docker asan \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-linux-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job builds emsdk and the browser test dependencies, so the wasm gates
  # import them instead of each gate building them. Change the scope to force
  # a rebuild.
  wasm-deps:
    name: Build wasm deps images (emsdk, Chrome)
    needs: deps
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build wasm-deps and wasm-browser-deps stages
        run: |
          ./dev docker wasm-browser-deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-base \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-to   type=gha,scope=tau-wasm-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The wasm32-emscripten resolver. Its resolve stage copies the store of
  # linux-resolve for the native parity tau and the host tools, so it waits
  # for that job and reads its layers.
  wasm-node:
    name: WebAssembly (Node.js)
    needs: [guard, wasm-deps, linux-resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Resolve and publish the store packages
        run: |
          ./dev docker wasm-node-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-linux-deps \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-to   type=gha,scope=tau-wasm-build,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: |
          ./dev docker wasm-node \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-from type=gha,scope=tau-wasm-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The browser stage copies the store from wasm-node-resolve, so it waits for
  # the wasm-node job and reads its layers. It does not wait for the linux
  # test job.
  wasm-browser:
    name: WebAssembly (browser)
    needs: [wasm-deps, wasm-node, linux-resolve]
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test
        run: |
          ./dev docker wasm-browser \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-from type=gha,scope=tau-wasm-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The windows-x86_64-mingw resolver. It publishes before the tests, so a
  # failed wine test keeps the mingw packages. Its stage copies the store of
  # linux-resolve for the host tools, so it waits for that job.
  linux-mingw64-wine-resolve:
    name: Windows cross-build store (MinGW)
    needs: [guard, linux-resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Resolve and publish the store packages
        run: |
          ./dev docker w64-build-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-linux-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base \
            --cache-to   type=gha,scope=tau-mingw64-wine-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The mingw test job reads the resolver's layers, so the store is a cache hit
  # and nothing resolves here. It runs the default pack only.
  linux-mingw64-wine:
    name: Windows cross-build (MinGW, wine)
    needs: linux-mingw64-wine-resolve
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-mingw64-wine-${{ github.sha }}
          restore-keys: |
            ccache-linux-mingw64-wine-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      - name: Build and test
        run: |
          ./dev docker w64-build \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TESTS=yes \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-mingw64-wine-deps \
            --cache-from type=gha,scope=tau-linux-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The native arm64 resolver. The same image as the x86_64 resolver on an
  # arm runner, so the arm64 store packages are built natively. It reads and
  # writes the arm64 scope only: the x86 layers never match an arm runner.
  linux-arm64-resolve:
    name: Linux arm64 store
    needs: guard
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04-arm runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Resolve and publish the store packages
        run: |
          ./dev docker linux-resolve \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-linux-arm64-deps \
            --cache-to   type=gha,scope=tau-linux-arm64-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The native arm64 test job reads the resolver's layers, so the store is a
  # cache hit and nothing resolves here. The pack matrix runs on x86_64 only,
  # so arm64 checks the platform with the default pack.
  linux-arm64:
    name: Linux arm64
    needs: linux-arm64-resolve
    runs-on: ubuntu-24.04-arm
    env:
      # ubuntu-24.04-arm runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-arm64-${{ github.sha }}
          restore-keys: |
            ccache-linux-arm64-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      - name: Build and test
        run: |
          ./dev docker build-release \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-linux-arm64-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The cross gate builds the arm64 suite on x86 in the Linux image and runs it
  # under qemu. Its stage starts from linux-resolve, so the host packages are
  # hits, and it resolves and publishes the cross arm64 packages.
  linux-arm64-cross:
    name: Linux arm64 cross (clang, qemu)
    needs: [guard, linux-resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The build container runs arm64 binaries through the host's binfmt
      # handler. The action registers it with the fix-binary flag, so the
      # handler works inside the container too.
      - name: Register qemu for the arm64 binaries
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-arm64-cross-${{ github.sha }}
          restore-keys: |
            ccache-linux-arm64-cross-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # No --cache-to: the test layer changes with every commit.
      - name: Resolve, build and test under qemu
        run: |
          ./dev docker linux-arm64-cross \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --secret id=store_publish,env=TAU_STORE_PUBLISH \
            --cache-from type=gha,scope=tau-linux-deps \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The windows-x86_64-msvc resolver. cl.exe and clang-cl record a different
  # compiler in the package id, so this job resolves both id sets once and
  # saves the store. The test matrix below needs it and restores that store.
  windows-msvc-store:
    name: Windows (MSVC) store
    needs: guard
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      # windows-latest runners are 4-core
      TAU_BUILD_JOBS: 4
      # Configure publishes each store entry right after it builds it.
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # The -all presets configure the binding, so configure needs the venv
      # interpreter. It needs no cl.exe, so it runs before the dev prompt.
      - name: Create the binding venv
        run: ./dev dep-python-venv

      # clang-cl uses the MSVC headers and libraries, so both presets need
      # this environment.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-windows-latest-${{ github.sha }}
          restore-keys: |
            tau-store-windows-latest-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # The Spot package is a host tool built with MSYS2 UCRT64 g++ (nothing
      # links it); the runner ships MSYS2 but not always this toolchain.
      - name: Install the MSYS2 UCRT64 toolchain
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc make"

      - name: Resolve the cl.exe store packages
        run: ./dev preset release-msvc-all --configure-only -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Resolve the clang-cl store packages
        run: ./dev preset release-msvc-all-clang-cl --configure-only -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # Saved even after a failure, so the next run keeps what did resolve.
      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

  windows-msvc:
    name: Native Windows (${{ matrix.preset }})
    needs: windows-msvc-store
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # windows-latest runners are 4-core
      TAU_BUILD_JOBS: 4
    strategy:
      fail-fast: false
      matrix:
        preset: [release-msvc-all, release-msvc-all-clang-cl]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Create the binding venv
        run: ./dev dep-python-venv

      # clang-cl uses the MSVC headers and libraries, so both presets need
      # this environment.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The store job saved this key for the same commit. Only the store job
      # saves it, so the two matrix entries do not race on one key.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-windows-latest-${{ github.sha }}
          restore-keys: |
            tau-store-windows-latest-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Only a store miss builds the Spot package, which needs this toolchain.
      - name: Install the MSYS2 UCRT64 toolchain
        if: steps.cache-store.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc make"

      # Git Bash runs ./dev, and the preset carries the compiler choice.
      - name: Build and test
        run: ./dev preset ${{ matrix.preset }} run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

  # The darwin-arm64 resolver: one job resolves, publishes and tests.
  macos:
    name: macOS
    needs: guard
    runs-on: macos-15
    permissions:
      contents: read
      packages: write
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
      TAU_STORE_KEEP: 3
      # Configure publishes each store entry right after it builds it.
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The store is content-addressed, so a restored entry is reused and a
      # miss is built here with the preset's own AppleClang. The key does not
      # need to describe the recipes: a stale key costs a rebuild, never a
      # wrong package.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-macos-15-${{ github.sha }}
          restore-keys: |
            tau-store-macos-15-

      - name: Install the binding venv, spot, and coreutils
        run: |
          brew install spot coreutils
          # The venv carries the interpreter and nanobind, and the script
          # appends TAU_PYTHON to the env for the build.
          ./dev dep-python-venv

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build tau and tests, run tests (Release)
        env:
          # Apple clang prints no stack dump. A crash leaves a preprocessed
          # reproducer here, and that is the only trace of it.
          CLANG_CRASH_DIAGNOSTICS_DIR: ${{ runner.temp }}/clang-crash
        run: |
          mkdir -p "$CLANG_CRASH_DIAGNOSTICS_DIR"
          ./dev preset release-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # saved after the run, so a build failure still keeps the packages that
      # did resolve and the next run does not rebuild them
      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      - name: Collect the compiler crash reports
        if: failure()
        run: |
          d="${{ runner.temp }}/clang-crash"
          cp ~/Library/Logs/DiagnosticReports/clang* "$d"/ 2>/dev/null || true
          ls -la "$d"
          for f in "$d"/*.ips "$d"/*.crash; do
            [ -f "$f" ] || continue
            echo "== $f"
            cat "$f"
          done

      - name: Upload the compiler crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-clang-crash
          path: ${{ runner.temp }}/clang-crash
          if-no-files-found: ignore

      - name: Run tau
        run: ./build/release/tau -v
