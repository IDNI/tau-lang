name: Test Release

on:
  push:
    branches: [ "devel", "devel-*", "feature/**", "issue/**" ]
  pull_request:
    branches: [ "main", "devel", "devel-*", "feature/**", "issue/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Choose the pack matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the packs
        id: matrix
        run: |
          default='{"name":"default","pack":""}'
          nobv='{"name":"nobv","pack":"sbf,tau,qint"}'
          bvonly='{"name":"bvonly","pack":"sbf,tau,bv"}'
          if [ -f cmake/tau_bas.cmake ]; then
            echo "matrix={\"include\":[$default,$nobv,$bvonly]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$default]}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux release tests (${{ matrix.name }})
    needs: probe
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          # ./dev and the image build both need the parser submodule
          submodules: recursive

      # container-driver builder; required for --cache-to type=gha
      - uses: docker/setup-buildx-action@v3

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v3

      # cvc5 and boost are built from source and cached under the shared
      # 'tau-deps' scope. Change the scope name to force a rebuild.
      - name: Build deps stage (cvc5 + boost, cached)
        run: |
          ./dev docker deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-to   type=gha,scope=tau-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Each pack writes its own tau_pack.h, so each entry is a full build
      # on top of the shared deps layer.
      - name: Build release tests and run them
        run: |
          ./dev docker build-release \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_BAS=${{ matrix.pack }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS release tests
    runs-on: macos-15
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
      # bump to force a rebuild of the cached ~/.tau dependency tree
      TAU_DEPS_EPOCH: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ~/.tau holds the cvc5 and boost trees; same key in every macOS job
      - name: Restore ~/.tau (cvc5 + boost)
        id: cache-tau
        uses: actions/cache/restore@v4
        with:
          path: ~/.tau
          key: tau-deps-macos-15-${{ env.TAU_DEPS_EPOCH }}-${{ hashFiles('scripts/dep-cvc5.sh', 'scripts/dep-boost.sh') }}

      - name: Build cvc5
        if: steps.cache-tau.outputs.cache-hit != 'true'
        run: ./dev dep-cvc5.sh --darwin -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Build boost
        if: steps.cache-tau.outputs.cache-hit != 'true'
        run: ./dev dep-boost.sh --darwin -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # saved here, before the build, so a failing build or test does not
      # discard the deps and force a rebuild on the next run
      - name: Save ~/.tau (cvc5 + boost)
        if: steps.cache-tau.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.tau
          key: ${{ steps.cache-tau.outputs.cache-primary-key }}

      - name: Install nanobind
        run: brew install nanobind

      - name: Build tau and tests, run tests (Release)
        run: ./dev preset release-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Run tau
        run: ./build/release/tau -v

  # Timing of the slow suites against a baseline from the last push to
  # devel. Informational: a regression prints, it does not fail the run.
  benchmark:
    name: Benchmark timing
    runs-on: ubuntu-24.04
    env:
      TAU_BUILD_JOBS: 4
      # bump to force a rebuild of the cached ~/.tau dependency tree
      TAU_DEPS_EPOCH: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build ccache

      - name: Restore ~/.tau (cvc5 + boost)
        id: cache-tau
        uses: actions/cache/restore@v4
        with:
          path: ~/.tau
          key: tau-deps-ubuntu-24.04-${{ env.TAU_DEPS_EPOCH }}-${{ hashFiles('scripts/dep-cvc5.sh', 'scripts/dep-boost.sh') }}

      - name: Build cvc5
        if: steps.cache-tau.outputs.cache-hit != 'true'
        run: ./dev dep-cvc5.sh -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Build boost
        if: steps.cache-tau.outputs.cache-hit != 'true'
        run: ./dev dep-boost.sh -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Save ~/.tau (cvc5 + boost)
        if: steps.cache-tau.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.tau
          key: ${{ steps.cache-tau.outputs.cache-primary-key }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-ubuntu-24.04-benchmark
          max-size: 200M

      - name: Build the release tests
        run: |
          ./dev preset release-tests \
            -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # The doctest listener in tests/test_init.h writes one JSON file per
      # binary when TAU_BENCHMARK_FILE is set. The list holds the slow
      # suites of the LTL, solver, interpreter and bv paths. test_ltl_perf
      # runs with its time bounds on, that is what it measures. A missing
      # binary is skipped, so a rename does not break this job.
      - name: Collect benchmark timing
        working-directory: build/release
        run: |
          mkdir -p benchmark_results
          for t in \
            test_ltl_aba \
            test_ltl_negative \
            test_ltl_qlt_bv \
            test_ltl_perf \
            test_algorithm_a \
            test_algorithm_b \
            test_algorithm_d \
            test_gr1_detect \
            test_ocltl_phi_delta \
            test_normal_forms \
            test_omcat_types \
            test_qlt_oracle \
            test_hsb \
            test_integration-interpreter \
            test_pointwise_revision \
            test_cpp_codegen_program_desc \
            test_integration-bv_stress_check \
            test_integration-heuristics-bv_predicate_blasting \
            ; do
            if [ -x "./$t" ]; then
              echo "=== benchmark: $t ==="
              TAU_BENCHMARK_FILE="benchmark_results/${t}.json" timeout 600 "./$t" || true
            fi
          done

      - name: Merge benchmark timing into one file
        working-directory: build/release
        run: |
          python3 - <<'EOF'
          import json, glob, os
          all_tests = []
          for f in sorted(glob.glob('benchmark_results/*.json')):
              try:
                  data = json.load(open(f))
                  suite = os.path.basename(f).replace('.json', '')
                  for t in data.get('tests', []):
                      t['binary'] = suite
                      all_tests.append(t)
              except Exception:
                  pass
          json.dump({'tests': all_tests, 'total_tests': len(all_tests)},
                    open('benchmark_current.json', 'w'), indent=2)
          print(f'Merged {len(all_tests)} test timings')
          EOF

      # The baseline is the last push to the target branch. A pull request
      # compares against its base branch.
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: build/release/benchmark_baseline.json
          key: benchmark-baseline-default-${{ github.base_ref || github.ref_name }}
          restore-keys: |
            benchmark-baseline-default-${{ github.base_ref || github.ref_name }}-

      - name: Check for performance regressions
        working-directory: build/release
        run: |
          python3 ../../scripts/benchmark_compare.py \
            --baseline benchmark_baseline.json \
            --current benchmark_current.json \
            --threshold 1.20

      - name: Save benchmark baseline (on push to devel)
        if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
        uses: actions/cache/save@v4
        with:
          path: build/release/benchmark_current.json
          key: benchmark-baseline-default-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-timing
          path: |
            build/release/benchmark_current.json
            build/release/benchmark_regressions.json
          retention-days: 90
