name: Test Release

on:
  push:
    branches: [ "devel", "devel-*", "feature/**", "issue/**" ]
  pull_request:
    branches: [ "main", "devel", "devel-*", "feature/**", "issue/**" ]
  workflow_dispatch:

permissions:
  contents: read
  # Normal CI only reads the store packages; the trusted deps-store.yml owns
  # packages: write.
  packages: read

env:
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Choose the pack matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose the packs
        id: matrix
        run: |
          default='{"name":"default","pack":""}'
          nobv='{"name":"nobv","pack":"sbf,tau,qint"}'
          bvonly='{"name":"bvonly","pack":"sbf,tau,bv"}'
          if [ -f cmake/tau_bas.cmake ]; then
            echo "matrix={\"include\":[$default,$nobv,$bvonly]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$default]}" >> "$GITHUB_OUTPUT"
          fi

  # One job builds cvc5 and boost, so the pack matrix imports the layer
  # instead of each entry building it. Change the scope to force a rebuild.
  deps:
    name: Build deps image (cvc5 + boost)
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          # ./dev and the image build both need the parser submodule
          submodules: recursive

      # container-driver builder; required for --cache-to type=gha
      - uses: docker/setup-buildx-action@v4

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build deps stage
        run: |
          ./dev docker deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-to   type=gha,scope=tau-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Linux release tests (${{ matrix.name }})
    needs: [probe, deps]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          # ./dev and the image build both need the parser submodule
          submodules: recursive

      # container-driver builder; required for type=gha cache
      - uses: docker/setup-buildx-action@v4

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      # A buildkit cache mount lives on the builder, and a runner is
      # discarded after the job, so the ccache directory needs a round trip
      # through the actions cache.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-ubuntu-24.04-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-24.04-${{ matrix.name }}-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # Each pack writes its own tau_pack.h, so each entry is a full build
      # on top of the deps layer the deps job cached.
      - name: Build release tests and run them
        run: |
          ./dev docker build-release \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_BAS=${{ matrix.pack }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-to   type=gha,scope=tau-release-${{ matrix.name }},mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  testnet:
    name: tau-testnet suite
    needs: linux
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          # ./dev and the image build both need the parser submodule
          submodules: recursive

      # container-driver builder; required for type=gha cache
      - uses: docker/setup-buildx-action@v4

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      # The default pack entry of the linux job writes this cache, so the
      # key names default. This job only reads, to avoid a duplicate save.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: ccache-ubuntu-24.04-default-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-24.04-default-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      # tau-testnet's specs use bv, so this suite only runs against the default pack
      - name: Run the tau-testnet suite
        run: |
          ./dev docker test-with-testnet \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-release-default
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job builds emsdk and the browser test dependencies, so the wasm gates
  # import them instead of each gate building them. Change the scope to force
  # a rebuild. These gates build the distributable wasm pack only; the wasm
  # dependencies resolve from the local store at configure time
  # (cmake/tau-deps.cmake), never the older ~/.tau dist path.
  wasm-deps:
    name: Build wasm deps images (emsdk, Chrome)
    needs: deps
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build wasm-deps and wasm-browser-deps stages
        run: |
          ./dev docker wasm-browser-deps \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-wasm-deps \
            --cache-to   type=gha,scope=tau-wasm-deps,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wasm-node:
    name: WebAssembly (Node.js)
    needs: wasm-deps
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test
        run: |
          ./dev docker wasm-node \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-wasm-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wasm-browser:
    name: WebAssembly (browser)
    needs: wasm-deps
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test
        run: |
          ./dev docker wasm-browser \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps \
            --cache-from type=gha,scope=tau-wasm-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS release tests
    runs-on: macos-15
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
      TAU_STORE_KEEP: 3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The store is content-addressed, so a restored entry is reused and a
      # miss is built here with the preset's own AppleClang. The key does not
      # need to describe the recipes: a stale key costs a rebuild, never a
      # wrong package.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-macos-15-${{ github.sha }}
          restore-keys: |
            tau-store-macos-15-

      - name: Install nanobind, spot, and coreutils for the test suites
        run: brew install nanobind spot coreutils

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build tau and tests, run tests (Release)
        env:
          # Apple clang prints no stack dump. A crash leaves a preprocessed
          # reproducer here, and that is the only trace of it.
          CLANG_CRASH_DIAGNOSTICS_DIR: ${{ runner.temp }}/clang-crash
        run: |
          mkdir -p "$CLANG_CRASH_DIAGNOSTICS_DIR"
          ./dev preset release-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # saved after the run, so a build failure still keeps the packages that
      # did resolve and the next run does not rebuild them
      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      - name: Collect the compiler crash reports
        if: failure()
        run: |
          d="${{ runner.temp }}/clang-crash"
          cp ~/Library/Logs/DiagnosticReports/clang* "$d"/ 2>/dev/null || true
          ls -la "$d"
          for f in "$d"/*.ips "$d"/*.crash; do
            [ -f "$f" ] || continue
            echo "== $f"
            cat "$f"
          done

      - name: Upload the compiler crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-clang-crash
          path: ${{ runner.temp }}/clang-crash
          if-no-files-found: ignore

      - name: Run tau
        run: ./build/release/tau -v

  # The MSVC target now builds cvc5 (bv and hsb), nlang (store curl) and the
  # full test suite, all resolved from the preset's own compiler; a miss is
  # built here and cached. The MSVC shell comes from ilammy/msvc-dev-cmd, so
  # the producers' vcvars64.bat search is only a local fallback.
  windows:
    name: Windows release (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAU_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: seanmiddleditch/gha-setup-ninja@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cl.exe is on PATH only inside a developer command prompt.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-windows-latest-${{ github.sha }}
          restore-keys: |
            tau-store-windows-latest-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # The Spot package is a host tool built with MSYS2 UCRT64 g++ (nothing
      # links it); the runner ships MSYS2 but not always this toolchain.
      - name: Install the MSYS2 UCRT64 toolchain
        if: steps.cache-store.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc make"

      - name: Build and test tau (Release, MSVC)
        run: ./dev preset release-msvc-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

