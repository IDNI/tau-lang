name: Tau Testnet

# The tau-testnet suite has its own status, so a tau-testnet failure does not
# mark the Test Release run. It tests the wheel of the Test Release run of the
# same commit and compiles nothing.
on:
  push:
    branches: [ "devel", "feature/**", "issue/**" ]
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Commit to test: a full sha, a branch or a tag (default: the head of
          the branch chosen above).
        required: false
        type: string
        default: ""
      title:
        description: >-
          Run name (default: the workflow name and the first line of the
          commit message).
        required: false
        type: string
        default: ""
      launcher:
        description: The run that started this one to name it (set by the workflow).
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  actions: read

# Every run is named "<workflow>: <commit message>". A push run reads the
# message from its event, whole: an expression cannot cut it at the first
# line. A manual or scheduled run starts again with the first line of its
# commit as its title (scripts/ci/name-run.sh).
run-name: "${{ github.event_name == 'workflow_dispatch' && (inputs.title || format('{0}: naming the run', github.workflow)) || github.event_name == 'schedule' && format('{0}: nightly', github.workflow) || format('{0}: {1}', github.workflow, github.event.head_commit.message || github.ref_name) }}"

env:
  # The commit a run tests: the pushed one, or the one a manual run names.
  TARGET: ${{ inputs.commit || github.sha }}
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit || github.ref }}
  cancel-in-progress: true

jobs:
  # tau-testnet's specs use bv, so this suite runs on the wheel of the default
  # pack. It takes the tau-wheel store package when the remote has it, else the
  # artifact of the same wheel.
  testnet:
    name: Linux x86_64 · tests (tau-testnet)
    runs-on: ubuntu-24.04
    # The wait covers the Test Release jobs before the wheel, and the suite
    # takes up to 140 minutes after it.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Name the run after its commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT: ${{ github.event_name }}
          TITLE: ${{ inputs.title }}
          LAUNCHER: ${{ inputs.launcher }}
        run: scripts/ci/name-run.sh name "${{ env.TARGET }}" "${{ github.ref_name }}" -f "commit=${{ inputs.commit }}"

      - name: Wait for the tau wheel of the Test Release run
        id: wheel
        timeout-minutes: 215
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # the commit, resolved, and the Test Release runs of it: a push run
          # has it as head, a manual run names it in its title
          SHA="$(gh api "repos/${REPO}/commits/${TARGET}" --jq .sha)"
          echo "testing ${SHA}"
          limit=$(( $(date +%s) + 210 * 60 ))
          run_id=""
          while :; do
            if [ -z "$run_id" ]; then
              run_id="$(gh run list --repo "$REPO" --workflow test-release.yml --limit 100 \
                --json databaseId,headSha,displayTitle,createdAt \
                --jq "[.[] | select((.displayTitle | test(\": (naming the run|nightly)\$\")) | not) | select(.headSha == \"${SHA}\"
                    or ((.displayTitle | test(\" on [0-9a-f]{7,40}\$\"))
                        and ((.displayTitle | sub(\".* on \"; \"\")) as \$t | \"${SHA}\" | startswith(\$t))))]
                  | sort_by(.createdAt) | reverse | .[0].databaseId // empty")"
              [ -z "$run_id" ] || echo "Test Release run ${run_id} of ${SHA}"
            fi
            if [ -n "$run_id" ]; then
              found="$(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts?name=tau-wheel" \
                --jq '[.artifacts[] | select(.name == "tau-wheel" and (.expired | not))] | length')"
              if [ "$found" -gt 0 ]; then
                echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              status="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .status)"
              if [ "$status" = completed ]; then
                echo "::notice::Test Release run ${run_id} ended without the tau-wheel artifact, so no tau-testnet suite runs."
                exit 0
              fi
            fi
            if [ "$(date +%s)" -ge "$limit" ]; then
              echo "::error::no tau-wheel artifact of a Test Release run of ${SHA} after 210 minutes"
              exit 1
            fi
            sleep 60
          done

      - uses: actions/checkout@v7
        if: steps.wheel.outputs.run_id != ''
        with:
          ref: ${{ env.TARGET }}
          submodules: recursive

      # A full producer build log passes the BuildKit step log limits.
      - uses: docker/setup-buildx-action@v4
        if: steps.wheel.outputs.run_id != ''
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - uses: crazy-max/ghaction-github-runtime@v4
        if: steps.wheel.outputs.run_id != ''

      - name: Download the tau wheel artifact
        if: steps.wheel.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: tau-wheel
          path: tau-wheel-artifact
          run-id: ${{ steps.wheel.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install oras for the dependency store
        if: steps.wheel.outputs.run_id != ''
        run: ./dev dep-oras

      - name: Log in to the dependency store
        if: steps.wheel.outputs.run_id != ''
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # store-remote.sh verifies a pulled entry before it imports it.
      - name: Take the wheel from the store, else from the artifact
        if: steps.wheel.outputs.run_id != ''
        run: |
          id="$(cat tau-wheel-artifact/store-id)"
          mkdir -p tau-wheel
          if external/parser/scripts/store-remote.sh pull "$HOME/.tau" "tau-wheel/${id}"; then
            echo "tau-wheel ${id}: from the store"
            cp "$HOME/.tau/store/tau-wheel/${id}/prefix"/tau_nanobind-*.whl tau-wheel/
          else
            echo "tau-wheel ${id}: not on the remote, from the artifact"
            cp tau-wheel-artifact/tau_nanobind-*.whl tau-wheel/
          fi

      - name: Run the tau-testnet suite
        if: steps.wheel.outputs.run_id != ''
        run: |
          ./dev docker test-with-testnet \
            --cache-from type=gha,scope=tau-base
        env:
          TAU_WHEEL_DIR: tau-wheel
