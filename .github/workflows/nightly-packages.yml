name: Nightly Packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

jobs:
  check_date:
    runs-on: ubuntu-24.04
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      # the commit walk below needs history, not just the tip
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: print latest_commit
        run: echo ${{ github.sha }}

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -z "$(git rev-list --after='24 hours' ${{ github.sha }})" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  check_tests:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    name: Require a green test run
    timeout-minutes: 90
    # Dispatching a missing Test Release run needs actions: write; every build
    # job keeps the workflow-level read-only token.
    permissions:
      contents: read
      actions: write
    steps:
      # Package only a commit whose own Test Release run passed. A commit with
      # no completed run gets one dispatched and waited on: the packages
      # rebuild the tests anyway, this only avoids spending a package build on
      # a commit already known to be broken.
      - name: Require Test Release to pass for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUNS: repos/${{ github.repository }}/actions/workflows/test-release.yml/runs
        run: |
          set -euo pipefail

          conclusion=$(gh api "$RUNS?head_sha=$SHA&status=completed" \
            --jq '.workflow_runs[0].conclusion // "none"')

          if [ "$conclusion" = "none" ]; then
            # workflow_dispatch takes a branch, never a sha, so a run can only
            # be requested for this commit while it is still the branch head.
            head=$(gh api "repos/$REPO/commits/$BRANCH" --jq .sha)
            if [ "$head" != "$SHA" ]; then
              echo "::error::$SHA is no longer the head of $BRANCH ($head);" \
                "cannot dispatch a Test Release for it"
              exit 1
            fi

            echo "No completed Test Release for $SHA; dispatching one"
            gh workflow run test-release.yml --ref "$BRANCH"

            run_id=""
            for _ in $(seq 30); do
              sleep 10
              run_id=$(gh api "$RUNS?head_sha=$SHA" --jq '.workflow_runs[0].id // empty')
              [ -n "$run_id" ] && break
            done
            if [ -z "$run_id" ]; then
              echo "::error::dispatched Test Release for $SHA never appeared"
              exit 1
            fi

            # blocks until the run finishes; non-zero exit if it did not pass
            gh run watch "$run_id" --exit-status
            exit 0
          fi

          echo "Test Release conclusion for $SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Test Release did not pass for this commit ($conclusion)"
            exit 1
          fi

  linux:
    name: Linux nightly packages
    needs: [ check_date, check_tests ]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    env:
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v3

      # --load is needed: the container-driver builder does not populate the
      # local image store. Packages land in ~/.tau/packages. The nightly target
      # stamps the date onto VERSION inside the image.
      - name: Build image with nightly packages
        run: |
          ./dev docker nightly --load \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # upload-artifact globs literally and will not expand ~,
      # so hand it an absolute path through the env
      - name: Locate Linux packages
        run: echo "PKG_DIR=$HOME/.tau/packages" >> "$GITHUB_ENV"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-x86_64
          path: ${{ env.PKG_DIR }}

  # The native arm64 packages are built on an arm host, in the same container
  # their consumers use.
  linux-arm64:
    name: Linux arm64 nightly packages
    needs: [ check_date, check_tests ]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04-arm
    env:
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build image with nightly packages
        run: |
          ./dev docker nightly --load \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=tau-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Linux arm64 packages
        run: echo "PKG_DIR=$HOME/.tau/packages" >> "$GITHUB_ENV"

      - name: Upload Linux arm64 packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-arm64
          path: ${{ env.PKG_DIR }}

  # The arm64 wheel is built on the arm runner: the interpreter, the extension
  # and the bundled cvc5 runtime must all be aarch64, which the x86 job cannot
  # produce. The platform tag is the interpreter's, so the file name carries the
  # arm64 tag.
  linux-arm64-wheel:
    name: Linux arm64 wheel
    needs: [ check_date, check_tests ]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04-arm
    env:
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # clang is the release preset's compiler. nanobind and the wheel repair
      # tool come from the shared venv, never from the system Python, and the
      # build takes the interpreter from TAU_PYTHON.
      - name: Install the wheel dependencies
        run: |
          ./dev setup-ubuntu-ci-deps.sh
          sudo apt-get install -y --no-install-recommends clang
          ./dev dep-python-venv

      # The store is content-addressed; a miss is built here with the preset's
      # own clang and reused by the next run.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-linux-arm64-${{ github.sha }}
          restore-keys: |
            tau-store-linux-arm64-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # The target builds the module, packs the wheel and publishes it to the
      # local store under the linux-arm64 target.
      - name: Build the arm64 wheel
        run: ./dev preset release-binding-python --target tau_wheel -DTAU_BUILD_JOBS=${{ env.BUILD_JOBS }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      - name: Locate the wheel
        run: echo "WHEEL_DIR=$PWD/build/release/bindings/python/nanobind/wheel" >> "$GITHUB_ENV"

      # The repair step retags and rewrites the wheel. Check the repaired
      # artifact before upload: its tag, module, bundled cvc5 runtime and paths.
      - name: Check the wheel contents
        run: |
          TAU_WHEEL_PATH="$(ls "$WHEEL_DIR"/*.whl)"
          export TAU_WHEEL_PATH
          "$TAU_PYTHON" tests/bindings/python/test_wheel_contents.py "$TAU_WHEEL_PATH"

      - name: Upload the arm64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-arm64-wheel
          path: ${{ env.WHEEL_DIR }}/*.whl

  # The x86_64 wheel is built on its own runner so the interpreter, the
  # extension and the bundled cvc5 runtime are all x86_64. auditwheel retags it
  # manylinux, so the file name carries the glibc floor, not linux_x86_64.
  linux-x86_64-wheel:
    name: Linux x86_64 wheel
    needs: [ check_date, check_tests ]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    env:
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # clang is the release preset's compiler. nanobind and the wheel repair
      # tool come from the shared venv, never from the system Python, and the
      # build takes the interpreter from TAU_PYTHON.
      - name: Install the wheel dependencies
        run: |
          ./dev setup-ubuntu-ci-deps.sh
          sudo apt-get install -y --no-install-recommends clang
          ./dev dep-python-venv

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-linux-x86_64-${{ github.sha }}
          restore-keys: |
            tau-store-linux-x86_64-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build the x86_64 wheel
        run: ./dev preset release-binding-python --target tau_wheel -DTAU_BUILD_JOBS=${{ env.BUILD_JOBS }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      - name: Locate the wheel
        run: echo "WHEEL_DIR=$PWD/build/release/bindings/python/nanobind/wheel" >> "$GITHUB_ENV"

      # The repair step retags and rewrites the wheel. Check the repaired
      # artifact before upload: its tag, module, bundled cvc5 runtime and paths.
      - name: Check the wheel contents
        run: |
          TAU_WHEEL_PATH="$(ls "$WHEEL_DIR"/*.whl)"
          export TAU_WHEEL_PATH
          "$TAU_PYTHON" tests/bindings/python/test_wheel_contents.py "$TAU_WHEEL_PATH"

      - name: Upload the x86_64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-x86_64-wheel
          path: ${{ env.WHEEL_DIR }}/*.whl

  # One SDK box per platform, packaged on its own: a cross box cannot share the
  # native box's install path or its toolchain.
  linux-sdk:
    name: Linux SDK packages (${{ matrix.preset }})
    needs: [ check_date, check_tests ]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: release-w64-sdk-packages-deb
          - preset: release-w64-sdk-packages-rpm
          - preset: release-wasm-sdk-packages-deb
          - preset: release-wasm-sdk-packages-rpm
          - preset: release-arm64-sdk-packages-deb
          - preset: release-arm64-sdk-packages-rpm
    env:
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The toolchain the platform preset cross-compiles with: MinGW from the
      # distro, emsdk from the same script the wasm gates use. rpm and the
      # archivers are the ones the Docker package image installs.
      - name: Install the cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm unzip xz-utils
          case "${{ matrix.preset }}" in
            *-w64-*) sudo apt-get install -y --no-install-recommends mingw-w64 ;;
            *-arm64-*) sudo apt-get install -y --no-install-recommends \
              clang g++-aarch64-linux-gnu ;;
            *) ./dev dep-emsdk ;;
          esac

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # The preset name contains `package`, so ./dev preset builds and packs.
      - name: Build and package the SDK box
        run: ./dev preset ${{ matrix.preset }} -DTAU_BUILD_JOBS=${{ env.BUILD_JOBS }}

      # upload-artifact globs literally and will not expand ~,
      # so hand it an absolute path through the env
      - name: Locate Linux packages
        run: echo "PKG_DIR=$HOME/.tau/packages" >> "$GITHUB_ENV"

      - name: Upload the SDK package
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-sdk-${{ matrix.preset }}
          path: ${{ env.PKG_DIR }}

  macos:
    name: macOS nightly packages
    needs: [ check_date, check_tests ]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: macos-15
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # macOS has no NIGHTLY build arg; stamp VERSION like the Dockerfile does
      - name: Stamp nightly version
        run: printf '%s' "$(head -n 1 VERSION)-$(date +%F)" > VERSION

      # The store is content-addressed; a miss is built with the preset's
      # AppleClang and reused by the next run.
      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-macos-15-${{ github.sha }}
          restore-keys: |
            tau-store-macos-15-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build macOS packages (.dmg + .zip)
        run: ./dev preset release-packages-macos -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      # upload-artifact globs literally and will not expand ~,
      # so hand it an absolute path through the env
      - name: Locate macOS packages
        run: echo "PKG_DIR=$HOME/.tau/packages" >> "$GITHUB_ENV"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-macos
          path: ${{ env.PKG_DIR }}

  # The macOS wheel is arm64 (the macos-15 image) and delocate retags it
  # macosx_*_arm64. nanobind and delocate come from pip. The cvc5 runtime
  # resolves from the store with AppleClang.
  macos-wheel:
    name: macOS wheel
    needs: [ check_date, check_tests ]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: macos-15
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # macOS has no NIGHTLY build arg; stamp VERSION like the Dockerfile does
      - name: Stamp nightly version
        run: printf '%s' "$(head -n 1 VERSION)-$(date +%F)" > VERSION

      # The venv carries the interpreter, nanobind and delocate, and the
      # script appends TAU_PYTHON for the build and the wheel check.
      - name: Create the wheel venv
        run: ./dev dep-python-venv

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-macos-15-${{ github.sha }}
          restore-keys: |
            tau-store-macos-15-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build the macOS wheel
        run: ./dev preset release-binding-python --target tau_wheel -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      - name: Locate the wheel
        run: echo "WHEEL_DIR=$PWD/build/release/bindings/python/nanobind/wheel" >> "$GITHUB_ENV"

      # The repair step retags and rewrites the wheel. Check the repaired
      # artifact before upload: its tag, module, bundled cvc5 runtime and paths.
      - name: Check the wheel contents
        run: |
          TAU_WHEEL_PATH="$(ls "$WHEEL_DIR"/*.whl)"
          export TAU_WHEEL_PATH
          "$TAU_PYTHON" tests/bindings/python/test_wheel_contents.py "$TAU_WHEEL_PATH"

      - name: Upload the macOS wheel
        uses: actions/upload-artifact@v4
        with:
          name: packages-darwin-arm64-wheel
          path: ${{ env.WHEEL_DIR }}/*.whl

  # The MSVC wheel needs the developer command prompt for cl.exe and the MSVC
  # dependency store. delvewheel bundles the cvc5 DLLs into the wheel.
  windows-msvc-wheel:
    name: Windows wheel (MSVC)
    needs: [ check_date, check_tests ]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAU_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: seanmiddleditch/gha-setup-ninja@v6

      # The venv carries the interpreter, nanobind and delvewheel, and the
      # script appends TAU_PYTHON for the build and the wheel check.
      - name: Create the wheel venv
        run: ./dev dep-python-venv

      # cl.exe is on PATH only inside a developer command prompt.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: tau-store-windows-latest-${{ github.sha }}
          restore-keys: |
            tau-store-windows-latest-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # The Spot package is a host tool built with MSYS2 UCRT64 g++ (nothing
      # links it); the runner ships MSYS2 but not always this toolchain.
      - name: Install the MSYS2 UCRT64 toolchain
        if: steps.cache-store.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc make"

      - name: Build the MSVC wheel
        run: |
          ./dev preset release-msvc-binding-python --target tau_wheel \
            -DPython_EXECUTABLE="$TAU_PYTHON" -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      - name: Locate the wheel
        run: echo "WHEEL_DIR=$PWD/build/release-msvc/bindings/python/nanobind/wheel" >> "$GITHUB_ENV"

      # The repair step rewrites the wheel. Check the repaired artifact before
      # upload: its tag, module, bundled cvc5 DLLs and paths.
      - name: Check the wheel contents
        run: |
          TAU_WHEEL_PATH="$(ls build/release-msvc/bindings/python/nanobind/wheel/*.whl)"
          export TAU_WHEEL_PATH
          "$TAU_PYTHON" tests/bindings/python/test_wheel_contents.py "$TAU_WHEEL_PATH"

      - name: Upload the MSVC wheel
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-x86_64-msvc-wheel
          path: ${{ env.WHEEL_DIR }}/*.whl

  publish:
    name: Publish nightly release
    needs: [ linux, linux-arm64, linux-arm64-wheel, linux-x86_64-wheel, linux-sdk,
      macos, macos-wheel, windows-msvc-wheel ]
    runs-on: ubuntu-24.04
    # Creating the release needs contents: write; the build jobs keep the
    # workflow-level read-only token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # merge-multiple flattens both artifacts into one directory
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages

      # The macOS job uploads under its own name, so the packages-* pattern
      # does not reach it.
      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages-macos
          path: packages

      - name: Read version and date
        run: |
          echo "version=v$(head -n 1 VERSION)" >> $GITHUB_ENV
          echo "date_iso=$(date +%F)" >> $GITHUB_ENV

      - name: List collected packages
        run: ls -la packages/

      - name: Create Nightly Build Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly-${{ env.date_iso }}"
          name: "Tau Language Framework ${{ env.version }} Nightly Build ${{ env.date_iso }}"
          body: "Tau Language Framework ${{ env.version }} automated nightly build ${{ env.date_iso }} commit ${{ github.sha }}"
          draft: true
          prerelease: true
          files: packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
